apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
  labels:
    app: users-ws
    tier: backend
  annotations:
    kubernetes.io/change-cause: "Started using users-config ConfigMap for environment variables"
spec:
  replicas: 4
  selector:
    matchLabels:
      app: users-ws
  template:
    metadata:
      labels:
        app: users-ws
    spec:
      containers:
        - name: users-ws-container
          image: codecode123/users-ws-public-demo:1.1.1
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: users-config